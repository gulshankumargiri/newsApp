name: news_app
description: A new Flutter project with clean architecture
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking & Retrofit
  dio: ^5.4.0
  retrofit: ^4.0.1
  json_annotation: ^4.8.1

  # State Management, DI, Database
  flutter_bloc: ^8.1.3
  provider:
  equatable: ^2.0.5
  get_it: ^7.6.4
  intl: ^0.18.1
  url_launcher: ^6.2.5



  #  UI Utilities
  flutter_hooks: ^0.20.4
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  #  Code Generation
  build_runner: ^2.4.6
  retrofit_generator: ^8.0.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true


  # To add assets to your application, add an assets section, like this:
